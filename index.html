
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff6ed">
  <title>Спасём приют для котиков 🐾</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #fff5e9, #ffe5e9);
      color: #4a3440;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 32px 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(140, 80, 80, 0.12);
    }

    .cat {
      font-size: 65px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 29px;
      line-height: 1.2;
      margin: 12px 0;
    }

    .description {
      font-size: 16px;
      line-height: 1.6;
      color: #806b74;
      margin-bottom: 26px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      width: 100%;
      border: none;
      padding: 19px 15px;
      border-radius: 17px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.97);
    }

    .against {
      background: #ff7899;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 120, 153, 0.25);
    }

    .for {
      background: #f2e8e8;
      color: #735c66;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .results {
      margin-top: 26px;
      display: none;
    }

    .result-title {
      font-weight: bold;
      margin-bottom: 16px;
    }

    .result-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 12px 0 6px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #f3e8e8;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: 20px;
      transition: width 0.6s ease;
    }

    .pink {
      background: #ff7899;
    }

    .gray {
      background: #b8a7ae;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #a58d97;
    }

    /* Всплывающее окно */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 25, 35, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 1000;
    }

    .overlay.active {
      display: flex;
    }

    .modal {
      background: #fff9f5;
      width: 100%;
      max-width: 500px;
      max-height: 90dvh;
      overflow-y: auto;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: appear 0.35s ease;
    }

    .modal-cat {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .modal h2 {
      font-size: 25px;
      margin: 10px 0 20px;
    }

    .modal-message {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-line;
      margin-bottom: 28px;
    }

    .close-button {
      background: #ff7899;
      color: white;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 18px;
      }

      h1 {
        font-size: 25px;
      }

      .description {
        font-size: 15px;
      }

      button {
        font-size: 16px;
        padding: 19px 12px;
      }

      .modal {
        padding: 30px 20px;
      }

      .modal-message {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="cat">🐱🐾</div>

    <h1>Спасём приют для котиков!</h1>

    <p class="description">
      Каждый голос имеет значение! ❤️
      <br>
      Поделись своим мнением о закрытии
      приюта для наших пушистых друзей.
    </p>

    <div class="buttons">
      <button class="against" id="againstBtn">
        ❤️ Я против закрытия приюта
      </button>

      <button class="for" id="forBtn">
        💔 Я за закрытие приюта
      </button>
    </div>

    <section class="results" id="results">
      <div class="result-title">🐾 Результаты голосования</div>

      <div class="result-label">
        <span>❤️ Против закрытия</span>
        <span id="againstPercent">0%</span>
      </div>

      <div class="progress">
        <div class="progress-fill pink" id="againstBar"></div>
      </div>

      <div class="result-label">
        <span>💔 За закрытие</span>
        <span id="forPercent">0%</span>
      </div>

      <div class="progress">
        <div class="progress-fill gray" id="forBar"></div>
      </div>
    </section>

    <div class="footer">
      Сделано с любовью к котикам 🐾
    </div>
  </main>

  <!-- Всплывающее окно -->
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog"
         aria-modal="true"
         aria-labelledby="modalTitle">

      <div class="modal-cat">🐱❤️</div>

      <h2 id="modalTitle">Спасибо за поддержку!</h2>

      <div class="modal-message" id="modalMessage"></div>

      <button class="close-button" id="closeBtn">
        Закрыть 🐾
      </button>
    </div>
  </div>

  <script>
    // ====================================
    // ТВОЯ ФРАЗА ПОСЛЕ ГОЛОСОВАНИЯ
    // ПРОТИВ ЗАКРЫТИЯ ПРИЮТА
    // ====================================

    const MESSAGE_FOR_AGAINST =
      'ДЛЯ ПОЛУЧЕНИЯ ПОДАРКА, НАПИШИ В БОТ СЛОВО " ЖИЗНЬ " ';

    // ====================================
    // ЛОГИКА ГОЛОСОВАНИЯ
    // ====================================

    const againstBtn = document.getElementById('againstBtn');
    const forBtn = document.getElementById('forBtn');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    const modalMessage = document.getElementById('modalMessage');

    // Демонстрационные результаты.
    // Они сохраняются только в этом браузере.
    let votesAgainst = Number(
      localStorage.getItem('catVotesAgainst') || 0
    );

    let votesFor = Number(
      localStorage.getItem('catVotesFor') || 0
    );

    let userVoted =
      localStorage.getItem('catUserVoted');

    function updateResults() {
      const total = votesAgainst + votesFor;

      if (total === 0) return;

      const againstPercent =
        Math.round((votesAgainst / total) * 100);

      const forPercent = 100 - againstPercent;

      document.getElementById('results').style.display = 'block';

      document.getElementById('againstPercent').textContent =
        againstPercent + '%';

      document.getElementById('forPercent').textContent =
        forPercent + '%';

      document.getElementById('againstBar').style.width =
        againstPercent + '%';

      document.getElementById('forBar').style.width =
        forPercent + '%';
    }

    function disableVoting() {
      againstBtn.disabled = true;
      forBtn.disabled = true;
    }

    function vote(type) {
      if (userVoted) return;

      if (type === 'against') {
        votesAgainst++;
        localStorage.setItem('catVotesAgainst', votesAgainst);
      } else {
        votesFor++;
        localStorage.setItem('catVotesFor', votesFor);
      }

      localStorage.setItem('catUserVoted', type);
      userVoted = type;

      disableVoting();
      updateResults();

      // Показываем фразу только тем,
      // кто против закрытия приюта.
      if (type === 'against') {
        modalMessage.textContent = MESSAGE_FOR_AGAINST;
        overlay.classList.add('active');
        closeBtn.focus();
      }
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    againstBtn.addEventListener('click', () => vote('against'));
    forBtn.addEventListener('click', () => vote('for'));

    closeBtn.addEventListener('click', closeModal);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' &&
          overlay.classList.contains('active')) {
        closeModal();
      }
    });

    if (userVoted) {
      disableVoting();
    }

    updateResults();
  </script>

</body>
</html>
